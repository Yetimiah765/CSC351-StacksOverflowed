# Keeps sports odds, game statuses, and final scores up to date by running
# scripts/syncSports.ts on GitHub's servers, so no one's laptop has to be on.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ODDS_API_KEY
# and optionally the repository variable ODDS_API_SPORTS (defaults to NFL).
#
# The free Odds API tier is 500 credits a month. Odds cost 3 credits per
# sport and scores 2, so with 2 sports (NFL + NBA) this schedule uses about
# 16 a day, roughly 480 a month.
#   06:00 UTC: odds + scores (catches the previous night's final scores,
#              well inside the API's 3-day scores window)
#   20:00 UTC: odds only (refreshes lines before the evening games)
# Game statuses also update from the clock between syncs (lib/sports/events.ts).

name: Sports odds sync

on:
  schedule:
    # GitHub may start scheduled runs a few minutes late.
    - cron: '0 6 * * *'
    - cron: '0 20 * * *'
  # Adds a "Run workflow" button on the Actions tab for a manual sync
  # (odds and scores).
  workflow_dispatch:

# Never run two syncs at once.
concurrency:
  group: sports-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ has the built-in WebSocket that supabase-js needs.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync odds and scores
        # The 20:00 run skips scores to stay within the free credit tier.
        run: npm run sync:sports -- ${{ github.event.schedule == '0 20 * * *' && '--odds-only' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_SPORTS: ${{ vars.ODDS_API_SPORTS }}
